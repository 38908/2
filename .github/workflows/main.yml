on: workflow_dispatch
jobs:
  build:
    runs-on: windows-2025
    steps:
      - run: |
          curl -O https://vcgit.hhi.fraunhofer.de/jvet/JM/-/archive/master/JM-master.zip
          tar -xf JM-master.zip
          cmake -S JM-master -B build -A x64
          cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          path: JM-master/bin/vs17/msvc-19.44/x86_64/release
